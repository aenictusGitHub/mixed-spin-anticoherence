  "ChannelSimplexTransfer",
  "ChoiScalarBounds",
  "CoherentBounds",
  "DensitySpan",
  "Determinant",
  "DickeEmbedding",
  "DickeGenerators",
  "DickeSU2",
  "EntropyFromDeterminant",
  "FidelityEntropyPrimitive",
  "FidelityEntropySpectral",
