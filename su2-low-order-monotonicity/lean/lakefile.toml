name = "su2_t2_fidelity"
version = "3.0.0"
defaultTargets = ["UniformFidelityCertificate"]
weakLeanArgs = ["-j1", "-s131072"]

[leanOptions]
Elab.async = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "f897ebcf72cd16f89ab4577d0c826cd14afaafc7"

