name = "fidelity_entropy_implication"
version = "1.0.0"
defaultTargets = ["FidelityEntropyAudit", "PhysicalConverse"]
weakLeanArgs = ["-j1", "-s131072"]

[leanOptions]
Elab.async = false

[[require]]
name = "su2_t2_fidelity"
path = "../../su2-low-order-monotonicity/lean"

[[lean_lib]]
name = "FidelityEntropyAudit"
roots = ["FidelityEntropyAudit"]

[[lean_lib]]
name = "PhysicalConverse"
roots = ["PhysicalConverse"]
globs = ["ConverseReduction", "ConverseSpectral", "ConverseRay", "ConverseSpectralClass", "ConverseVariance", "ConverseMatrices", "ConverseChannels"]
